name: LexOS Terminal - Android APK test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer outils de gestion SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Installer Android SDK et NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Recuperer les modules libres Termux
        run: bash scripts/fetch-termux-engine.sh
      - name: Verifier les composants et l'interface
        run: python3 tests/check_project.py
      - name: Compiler l'APK Android
        run: gradle :app:assembleDebug -PversionCode=$((100 + GITHUB_RUN_NUMBER)) --no-daemon --stacktrace
      - name: Signer avec la cle commune LexOS
        env:
          LEXOS_KEYSTORE_BASE64: ${{ secrets.LEXOS_KEYSTORE_BASE64 }}
          LEXOS_KEYSTORE_PASSWORD: ${{ secrets.LEXOS_KEYSTORE_PASSWORD }}
          LEXOS_KEY_ALIAS: ${{ secrets.LEXOS_KEY_ALIAS }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -z "$LEXOS_KEYSTORE_BASE64" ]; then
            echo "::warning::Cle commune LexOS absente (secrets non disponibles) : l'APK garde sa signature de test."
            exit 0
          fi
          echo "$LEXOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lexos.keystore"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/lexos.keystore" --ks-key-alias "$LEXOS_KEY_ALIAS" \
            --ks-pass env:LEXOS_KEYSTORE_PASSWORD --key-pass env:LEXOS_KEYSTORE_PASSWORD \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | head -n 3
          rm -f "$RUNNER_TEMP/lexos.keystore"
      - name: Verifier l'APK et empreinte SHA256
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee SHA256SUMS
      - name: Archiver APK sans publication
        uses: actions/upload-artifact@v4
        with:
          name: LexOS-Terminal-Android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

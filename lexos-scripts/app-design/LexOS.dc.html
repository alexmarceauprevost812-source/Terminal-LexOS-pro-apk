<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Terminal LexOS IA</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#EDEDED}a:hover{color:#A3A3A3}
@keyframes lnIn{from{opacity:0;transform:translateX(-10px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.ln{animation:lnIn .28s ease-out both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes stripes{to{background-position:28px 0}}
.bar{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.35) 0 7px,transparent 7px 14px);background-size:28px 28px;animation:stripes .6s linear infinite;transition:width .12s linear}
.frame,.tint{transition:box-shadow .45s ease,border-color .45s ease,background-color .45s ease,color .45s ease}
.chip{transition:transform .12s ease,border-color .2s ease,background-color .2s ease}
.chip:hover{border-color:#3A3A3A;background-color:#111}
.chip:active{transform:scale(.94)}
@keyframes dot{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.dot{animation:dot 1.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
@keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.55}93%{opacity:1}95%{opacity:.75}}
.logo{text-shadow:3px 3px 0 #2A2A2A;animation:flick 5s linear infinite}
@keyframes think{0%,100%{opacity:.25}50%{opacity:1}}
.think{animation:think 1s ease-in-out infinite}
.term::-webkit-scrollbar{width:0}
input::placeholder{color:#5E5E5E}
.menuBtn{transition:transform .12s ease,box-shadow .3s ease}
.menuBtn:active{transform:scale(.92)}
@keyframes drwIn{from{transform:translateX(-100%);opacity:.4}to{transform:none;opacity:1}}
.drawer{animation:drwIn .22s ease-out both}
.drawer::-webkit-scrollbar{width:0}
@keyframes ovlIn{from{opacity:0}to{opacity:1}}
.ovl{animation:ovlIn .22s ease-out both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 12px; background-color: #000000; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #EDEDED; overflow: hidden; position: relative">

  <div class="tint" style="height: 2px; border-radius: 2px; background-color: {{lineColor}}; box-shadow: 0 0 12px {{glow}}; flex-shrink: 0"></div>

  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
      <button class="menuBtn" onClick="{{onMenu}}" aria-label="Ouvrir le menu" style="flex-shrink: 0; width: 44px; height: 44px; padding: 0; border-radius: 11px; border: 1px solid {{frameBorder}}; background-color: #0A0A0A; box-shadow: 0 0 12px {{glow}}; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <img src="/_blob/ac218205c785cd1015d88d49d90e781e" alt="" style="width: 38px; height: 38px; border-radius: 8px; display: block"></button>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <div class="logo" style="font-family: Silkscreen, monospace; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: 1px; color: #EDEDED">LEXOS</div>
        <div style="font-size: 10.5px; color: #7A7A7A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">TERMINAL PRO · IA locale · llama.cpp</div>
      </div>
    </div>
    <div class="tint" style="display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid {{frameBorder}}; background-color: #0A0A0A; color: {{color}}; box-shadow: 0 0 12px {{glow}}; font-size: 11px; font-weight: 800; letter-spacing: 1px; white-space: nowrap">
      <sc-if value="{{working}}" hint-placeholder-val="{{ false }}">
        <span class="spin" style="width: 11px; height: 11px; border-radius: 50%; border: 2px solid {{glow}}; border-top-color: {{color}}; box-sizing: border-box"></span>
      </sc-if>
      <span class="pulse">{{modeEmoji}}</span><span>{{modeLabel}}</span>

  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="6">
      <button class="chip" onClick="{{m.run}}" style="min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid {{m.border}}; background-color: {{m.bg}}; color: {{m.text}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; cursor: pointer">{{m.label}}</button>
    </sc-for>
  </div>

  <div class="frame" style="flex: 1 1 auto; min-height: 0; position: relative; border-radius: 16px; border: 1px solid {{frameBorder}}; box-shadow: 0 0 24px {{glow}}, inset 0 0 40px {{glowSoft}}; background-color: #070707; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #161616; flex-shrink: 0; font-size: 11px">
      <span style="color: #7A7A7A">❯_ lexos · mode <span class="tint" style="color: {{modeTextColor}}; font-weight: 700">{{currentMode}}</span></span>
      <span style="color: #7A7A7A">llama.cpp</span>
    </div>
    <div class="term" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column-reverse; padding: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{lines}}" as="line" hint-placeholder-count="6">
          <div class="ln" style="font-size: 12.5px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; color: {{line.color}}; text-shadow: 0 0 8px {{line.glow}}">{{line.text}}</div>
        </sc-for>
        <sc-if value="{{thinking}}" hint-placeholder-val="{{ false }}">
          <div class="ln" style="display: flex; gap: 4px; align-items: center; font-size: 12.5px; color: {{color}}">
            <span>lex</span>
            <span class="think" style="width: 5px; height: 5px; border-radius: 50%; background-color: {{color}}"></span>
            <span class="think" style="width: 5px; height: 5px; border-radius: 50%; background-color: {{color}}; animation-delay: .2s"></span>
            <span class="think" style="width: 5px; height: 5px; border-radius: 50%; background-color: {{color}}; animation-delay: .4s"></span>
          </div>
        </sc-if>
        <sc-if value="{{hasProgress}}" hint-placeholder-val="{{ false }}">
          <div class="ln" style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
            <div style="display: flex; justify-content: space-between; font-size: 11.5px; color: {{progressColor}}">
              <span>{{progressLabel}}</span><span>{{pct}}% · {{speed}}</span>
            </div>
            <div style="height: 10px; border-radius: 5px; background-color: #141414; overflow: hidden; border: 1px solid #1F1F1F">
              <div class="bar" style="height: 100%; width: {{pct}}%; background-color: {{progressColor}}; box-shadow: 0 0 12px {{progressColor}}; border-radius: 5px"></div>
            </div>
          </div>
        </sc-if>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0">
    <sc-for list="{{chips}}" as="chip" hint-placeholder-count="5">
      <button class="chip" onClick="{{chip.run}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #222222; background-color: #0A0A0A; color: #D4D4D4; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; cursor: pointer">
        <span class="dot" style="width: 7px; height: 7px; border-radius: 50%; background-color: {{chip.color}}; box-shadow: 0 0 8px {{chip.color}}"></span>
        <span>{{chip.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
    <label for="cmd2" class="tint" style="display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid {{frameBorder}}; background-color: #070707">
      <span class="tint" style="color: {{promptColor}}; font-weight: 800; white-space: nowrap">toi ❯</span>
      <input id="cmd2" type="text" value="{{input}}" onChange="{{onInput}}" onKeyDown="{{onKey}}" placeholder="parle à lex…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Message ou commande" style="flex: 1 1 auto; min-width: 0; background: transparent; border: none; outline: none; color: #EDEDED; font-family: 'JetBrains Mono', monospace; font-size: 14px">
      <span class="cur tint" style="width: 8px; height: 16px; background-color: {{promptColor}}"></span>
    </label>
    <button class="tint" onClick="{{onSend}}" aria-label="Envoyer" style="width: 52px; height: 52px; border-radius: 14px; border: none; background-color: {{sendBg}}; color: #000000; font-size: 20px; font-weight: 900; box-shadow: 0 0 16px {{glow}}; cursor: pointer">⏎</button>
  </div>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div class="ovl" onClick="{{onMenu}}" style="position: absolute; inset: 0; background-color: rgba(0,0,0,.62); z-index: 20"></div>
    <div class="drawer" style="position: absolute; top: 0; left: 0; bottom: 0; width: 250px; z-index: 21; box-sizing: border-box; background-color: #070707; border-right: 1px solid {{frameBorder}}; box-shadow: 0 0 34px {{glow}}; display: flex; flex-direction: column; padding: 18px 14px; gap: 12px; overflow-y: auto">
      <div style="display: flex; align-items: center; gap: 10px">
        <img src="/_blob/ac218205c785cd1015d88d49d90e781e" alt="" style="width: 38px; height: 38px; border-radius: 9px; display: block">
        <div style="display: flex; flex-direction: column">
          <span class="logo" style="font-family: Silkscreen, monospace; font-weight: 700; font-size: 20px; color: #EDEDED">LEXOS</span>
          <span style="font-size: 10px; color: #7A7A7A">menu principal</span>
        </div>
        <button class="chip" onClick="{{onMenu}}" aria-label="Fermer le menu" style="margin-left: auto; width: 34px; height: 34px; border-radius: 8px; border: 1px solid #222222; background-color: #0A0A0A; color: #A3A3A3; font-size: 16px; cursor: pointer">✕</button>
      </div>
      <div style="height: 1px; background-color: #161616; flex-shrink: 0"></div>
      <div style="font-size: 10px; letter-spacing: 1px; color: #5E5E5E">MODES IA</div>
      <sc-for list="{{menuModes}}" as="it" hint-placeholder-count="6">
        <button class="chip" onClick="{{it.run}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 11px; border: 1px solid #1E1E1E; background-color: #0A0A0A; color: #D4D4D4; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer; text-align: left">
          <span style="width: 8px; height: 8px; border-radius: 50%; background-color: {{it.color}}; box-shadow: 0 0 8px {{it.color}}; flex-shrink: 0"></span>
          <span>{{it.emoji}} {{it.label}}</span>
        </button>
      </sc-for>
      <div style="font-size: 10px; letter-spacing: 1px; color: #5E5E5E; margin-top: 4px">COMMANDES</div>
      <sc-for list="{{menuCmds}}" as="it" hint-placeholder-count="5">
        <button class="chip" onClick="{{it.run}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 11px; border: 1px solid #1E1E1E; background-color: #0A0A0A; color: #D4D4D4; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left">
          <span class="dot" style="width: 7px; height: 7px; border-radius: 50%; background-color: {{it.color}}; box-shadow: 0 0 8px {{it.color}}; flex-shrink: 0"></span>
          <span>{{it.label}}</span>
        </button>
      </sc-for>
      <div style="font-size: 10px; letter-spacing: 1px; color: #5E5E5E; margin-top: 4px">SYSTÈME</div>
      <button class="chip" onClick="{{onBureau}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 11px; border: 1px solid #1E1E1E; background-color: #0A0A0A; color: #D4D4D4; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer; text-align: left">
        <span class="dot" style="width: 7px; height: 7px; border-radius: 50%; background-color: #4D8DFF; box-shadow: 0 0 8px #4D8DFF; flex-shrink: 0"></span>
        <span>🖥️ bureau à distance</span>
      </button>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.n = 0;
    this.timers = [];
    this.iv = null;
    this.C = { dl: '#B46BFF', scan: '#22D3EE', ok: '#39FF88', err: '#FF4D6D', del: '#FF9F1C', net: '#4D8DFF', help: '#FFD23F' };
    this.G = { w: '#EDEDED', g: '#A3A3A3', d: '#7A7A7A' };
    this.M = {
      '/chat': { color: '#2DD4BF', emoji: '💬', label: 'CHAT', info: 'Discussion libre avec l’IA locale' },
      '/codex': { color: '#38BDF8', emoji: '🧠', label: 'CODEX', info: 'Écrit et corrige du code' },
      '/auto': { color: '#FB7185', emoji: '⚙️', label: 'AUTO', info: 'L’IA choisit le bon mode toute seule' },
      '/agent': { color: '#A3E635', emoji: '🕵️', label: 'AGENT', info: 'Fait des tâches étape par étape' },
      '/model': { color: '#E879F9', emoji: '🧩', label: 'MODÈLE', info: 'Modèle chargé : llama.cpp (local)' },
      '/q': { color: '#A3A3A3', emoji: '👋', label: 'QUITTER', info: 'À la prochaine !' }
    };
    this.state = {
      lines: [
        this.mk('Démarrage du moteur en arrière-plan…', '#7A7A7A'),
        this.mk('🧠 IA prête ! Parle-lui directement.', '#39FF88'),
        this.mk('Choisis un mode en haut, ou tape « aide » 👇', '#7A7A7A')
      ],
      input: '',
      color: null,
      modeEmoji: '●',
      modeLabel: 'PRÊT',
      current: '/chat',
      progress: null,
      thinking: false,
      busy: false,
      menuOpen: false
    };
  }

  componentWillUnmount() { this.clearAll(); }

  clearAll() {
    this.timers.forEach((t) => clearTimeout(t));
    this.timers = [];
    if (this.iv) { clearInterval(this.iv); this.iv = null; }
  }

  mk(text, color) { this.n += 1; return { id: this.n, text: text, color: color || '#EDEDED' }; }

  push(arr) {
    const add = arr.map((a) => this.mk(a[0], a[1]));
    this.setState((s) => ({ lines: s.lines.concat(add).slice(-80) }));
  }

  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }

  mode(color, emoji, label) { this.setState({ color: color, modeEmoji: emoji, modeLabel: label, busy: true }); }

  finish(ms) {
    this.later(ms || 1500, () => this.setState({ color: null, modeEmoji: '●', modeLabel: 'PRÊT', busy: false, thinking: false }));
  }

  progress(label, color, done) {
    let pct = 0;
    this.setState({ progress: { label: label, color: color, pct: 0, speed: '0 Mo/s' } });
    this.iv = setInterval(() => {
      pct = Math.min(100, pct + 2 + Math.floor(Math.random() * 7));
      const sp = (4 + Math.random() * 3).toFixed(1) + ' Mo/s';
      this.setState({ progress: { label: label, color: color, pct: pct, speed: sp } });
      if (pct >= 100) {
        clearInterval(this.iv); this.iv = null;
        this.later(250, () => { this.setState({ progress: null }); done(); });
      }
    }, 110);
  }

  ask(text) {
    const m = this.M[this.state.current] || this.M['/chat'];
    this.mode(m.color, m.emoji, 'RÉFLÉCHIT');
    this.setState({ thinking: true });
    this.later(1300, () => {
      this.setState({ thinking: false });
      this.push([['lex ❯ [la réponse de l’IA s’affiche ici]', m.color]]);
      this.finish(900);
    });
  }

  run(raw) {
    const C = this.C;
    const G = this.G;
    const cmd = (raw || '').trim();
    if (!cmd) return;
    this.setState({ input: '' });
    this.push([['toi ❯ ' + cmd, G.w]]);
    if (this.state.busy) { this.push([['⏳ Une tâche roule déjà, attends un peu…', G.d]]); return; }

    const parts = cmd.split(/\s+/);
    const c = parts[0].toLowerCase();
    const rest = parts.slice(1);
    const arg = rest.join(' ');
    const sub = (rest[0] || '').toLowerCase();
    const isDl = ['telecharger', 'télécharger', 'download', 'dl', 'wget', 'curl'].indexOf(c) >= 0
      || (c === 'git' && sub === 'clone')
      || (['pkg', 'apt', 'pip', 'npm'].indexOf(c) >= 0 && ['install', 'i'].indexOf(sub) >= 0);

    if (this.M[c]) {
      const m = this.M[c];
      this.mode(m.color, m.emoji, m.label);
      if (c !== '/q' && c !== '/model') this.setState({ current: c });
      this.push([[m.emoji + ' Mode ' + c, m.color]]);
      this.later(400, () => { this.push([['   ' + m.info, m.color]]); this.finish(900); });
    } else if (c === 'aide' || c === 'help') {
      this.mode(C.help, '📖', 'AIDE');
      this.push([
        ['📖 Modes IA :', G.w],
        ['  💬 /chat   🧠 /codex   ⚙️ /auto', G.g],
        ['  🕵️ /agent  🧩 /model   👋 /q', G.g],
        ['📖 Commandes :', G.w],
        ['  ⬇️  telecharger <fichier>', C.dl],
        ['  🔍  scan', C.scan],
        ['  📡  ping <hôte>', C.net],
        ['  🔄  maj', C.ok],
        ['  🔥  supprimer <fichier>', C.del],
        ['  🧹  effacer', G.g],
        ['💡 Tout le reste est envoyé à lex', G.d]
      ]);
      this.finish(1200);
    } else if (isDl) {
      const f = (c === 'git' || ['pkg', 'apt', 'pip', 'npm'].indexOf(c) >= 0) ? (rest.slice(1).join(' ') || 'paquet') : (arg || 'modele.gguf');
      this.mode(C.dl, '⬇️', 'TÉLÉCHARGEMENT');
      this.push([['🟣 Connexion au serveur…', C.dl]]);
      this.later(500, () => {
        this.push([['⬇️ Réception de ' + f + ' (379 Mo)', C.dl]]);
        this.progress('⬇️ ' + f, C.dl, () => {
          this.push([['💜 ' + f + ' téléchargé ✅', C.dl]]);
          this.finish();
        });
      });
    } else if (c === 'scan' || c === 'nmap') {
      this.mode(C.scan, '🔍', 'SCAN');
      this.push([['🔍 Scan du réseau local en cours…', C.scan]]);
      const found = ['🛰️  192.168.1.1    routeur', '📱  192.168.1.12   téléphone', '💻  192.168.1.20   ordinateur'];
      found.forEach((d, i) => this.later(600 * (i + 1), () => this.push([[d, C.scan]])));
      this.later(600 * (found.length + 1), () => { this.push([['✅ ' + found.length + ' appareils trouvés', C.scan]]); this.finish(); });
    } else if (c === 'ping') {
      const h = arg || 'lexos.ca';
      this.mode(C.net, '📡', 'RÉSEAU');
      this.push([['📡 PING ' + h, C.net]]);
      for (let i = 1; i <= 3; i++) {
        this.later(500 * i, () => this.push([['  ↩️ réponse de ' + h + ' : ' + (12 + Math.floor(Math.random() * 30)) + ' ms', C.net]]));
      }
      this.later(2000, () => { this.push([['✅ 0 % perdu', C.net]]); this.finish(); });
    } else if (c === 'bureau' || c === 'rdp' || c === 'vnc' || c === 'distance') {
      this.mode('#4D8DFF', '🖥️', 'BUREAU À DISTANCE');
      this.push([['🖥️ Bureau à distance', '#4D8DFF']]);
      this.later(500, () => this.push([['🔗 Connexion à 192.168.1.20…', '#4D8DFF']]));
      this.later(1100, () => this.push([['🔐 Authentification…', '#4D8DFF']]));
      this.later(1700, () => this.progress('🖥️ Flux vidéo', '#4D8DFF', () => {
        this.push([['✅ Session ouverte · 1920×1080', '#39FF88']]);
        this.finish();
      }));
    } else if (c === 'maj' || c === 'update' || c === 'upgrade') {
      this.mode(C.ok, '🔄', 'MISE À JOUR');
      this.push([['🔄 Recherche des mises à jour…', C.ok]]);
      this.later(500, () => this.progress('🔄 Installation', C.ok, () => {
        this.push([['💚 LexOS à jour ✅', C.ok]]);
        this.finish();
      }));
    } else if (c === 'supprimer' || c === 'rm' || c === 'delete') {
      const f = arg || 'cache.tmp';
      this.mode(C.del, '🔥', 'SUPPRESSION');
      this.push([['🔥 Suppression de ' + f + '…', C.del]]);
      this.later(800, () => { this.push([['🗑️ ' + f + ' supprimé', C.del]]); this.finish(); });
    } else if (c === 'effacer' || c === 'clear' || c === 'cls') {
      this.setState({ lines: [] });
    } else {
      this.ask(cmd);
    }
  }

  renderVals() {
    const C = this.C;
    const G = this.G;
    const active = this.state.color;
    const p = this.state.progress;
    const greys = [G.w, G.g, G.d];
    const cur = this.state.current;
    const curM = this.M[cur] || this.M['/chat'];
    const chipDefs = [
      ['⬇️ télécharger', 'telecharger modele.gguf', C.dl],
      ['🔍 scan', 'scan', C.scan],
      ['🔄 maj', 'maj', C.ok],
      ['🔥 supprimer', 'supprimer cache.tmp', C.del],
      ['❓ aide', 'aide', C.help]
    ];
    const modeKeys = ['/chat', '/codex', '/auto', '/agent', '/model', '/q'];
    return {
      color: active || G.g,
      lineColor: active || '#141414',
      promptColor: active || G.w,
      sendBg: active || G.w,
      frameBorder: active ? active + '80' : '#1C1C1C',
      glow: active ? active + '66' : 'rgba(0,0,0,0)',
      glowSoft: active ? active + '14' : 'rgba(0,0,0,0)',
      working: !!active,
      thinking: this.state.thinking,
      modeEmoji: this.state.modeEmoji,
      modeLabel: this.state.modeLabel,
      currentMode: cur,
      modeTextColor: curM.color,
      modes: modeKeys.map((k) => {
        const on = k === cur;
        const col = this.M[k].color;
        return { label: k, text: on ? col : G.g, border: on ? col + '99' : '#222222', bg: on ? col + '14' : '#0A0A0A', run: () => this.run(k) };
      }),
      lines: this.state.lines.map((l) => ({ id: l.id, text: l.text, color: l.color, glow: greys.indexOf(l.color) >= 0 ? 'rgba(0,0,0,0)' : l.color + '55' })),
      hasProgress: !!p,
      progressLabel: p ? p.label : '',
      progressColor: p ? p.color : G.g,
      pct: p ? p.pct : 0,
      speed: p ? p.speed : '',
      chips: chipDefs.map((d) => ({ label: d[0], color: d[2], run: () => this.run(d[1]) })),
      menuOpen: this.state.menuOpen,
      onMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),
      menuModes: modeKeys.map((k) => ({ label: this.M[k].label, emoji: this.M[k].emoji, color: this.M[k].color, run: () => { this.setState({ menuOpen: false }); this.run(k); } })),
      menuCmds: chipDefs.map((d) => ({ label: d[0], color: d[2], run: () => { this.setState({ menuOpen: false }); this.run(d[1]); } })),
      onBureau: () => { this.setState({ menuOpen: false }); this.run('bureau'); },
      input: this.state.input,
      onInput: (e) => this.setState({ input: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.run(this.state.input); } },
      onSend: () => this.run(this.state.input)
    };
  }
}
</script>
